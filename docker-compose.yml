services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"

  # Optional local SQL Server for machines without one: docker compose --profile sql up -d sqlserver
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kentico-migrator-sql
    profiles: ["sql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports:
      - "14333:1433"
